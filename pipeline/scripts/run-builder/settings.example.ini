# Run builder settings (example).
#
# Copy to settings.ini beside this file and edit the copy. settings.ini is
# gitignored: it holds this machine's paths. Every key can also be set with the
# environment variable named after it, which wins over the file.
# serve.py reads it at start; restart the server after editing.

[run-builder]
# The data root: datasets/, colmap/, outputs/, exports/ live under it. The
# server refuses every path outside it. Required.   RUN_BUILDER_DATA_ROOT
data_root = /path/to/data
# Where Save writes configs. Inside the data root. Empty: <data_root>/configs.
#                                                   RUN_BUILDER_CONFIGS_DIR
configs_dir =
# Catalog root for collection runs (pipeline/CATALOG-RECORDS.md). Inside the
# data root. Empty: the data root.                  RUN_BUILDER_CATALOG_ROOT
catalog_root =
# Catalog root ID, kebab-case, for example my-data. RUN_BUILDER_CATALOG_ROOT_ID
catalog_root_id =
# One shell line printed before the commands, for example
#   export PATH="$HOME/opt/colmap-prefix/bin:$HOME/.local/bin:$PATH"
#                                                   RUN_BUILDER_SHELL_SETUP
shell_setup =
# On WSL2: true starts the page with "run under wsl-guard" ticked, so a single
# capture's real run is printed through pipeline/scripts/wsl-guard/.
#                                                   RUN_BUILDER_WSL_GUARD
wsl_guard =

[samask]
# The samask checkout. Its commands run inside it, in its own environment.
#                                                   RUN_BUILDER_SAMASK_DIR
directory =
# The command, run inside that directory. Placeholders, each filled
# shell-quoted: {images} the capture's images/, {masks} the variant's
# masks_<variant>/, {prompt}, {capture}, {variant}. --masks must be given:
# samask writes masks/ by default and the pipeline reads masks_<variant>/.
# Name the device explicitly; samask's default is the CPU.
#                                                   RUN_BUILDER_SAMASK_COMMAND
command = uv run python 01_segmask_sam3_hq.py --images {images} --masks {masks} --prompt {prompt} --device cpu
# The extension samask writes masks with; becomes [dataset] mask_extensions.
#                                                   RUN_BUILDER_SAMASK_MASK_EXTENSION
mask_extension = .png
