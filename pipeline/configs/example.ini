# jsps-dt4ag pipeline configuration (example)
#
# Copy this file, edit the copy, and point the pipeline at it:
#
#     cp configs/example.ini configs/my-run.ini
#     export DT4AG_CONFIG=$PWD/configs/my-run.ini
#
# Every path and placeholder below is deliberately neutral. This pipeline
# reconstructs arbitrary scenes and objects; it contains no subject-specific
# logic. Put your real dataset names in your own config, never in this file.
#
# Format is INI, read by Python's stdlib configparser. The pipeline environment
# is Python 3.10, where tomllib is not available, so INI is the zero-dependency
# choice. See configs/README.md for what every key does.

[paths]
# Root of the working data tree. Absolute, or relative to this config file.
# Everything else hangs off it. This replaces the hardcoded removable-drive
# path that used to sit in the notebook.
data_root = /path/to/data

# Names of the four working directories under data_root. Defaults shown.
datasets_dirname = datasets
colmap_dirname   = colmap
outputs_dirname  = outputs
exports_dirname  = exports

[dataset]
# Path of the directory holding the input images, RELATIVE to
# <data_root>/<datasets_dirname>. Give the exact path. The old notebook
# guessed it with four chained substring-matching loops that never broke out,
# so with two matching sibling directories the last one silently won.
#
# Any depth works, including a single level. Examples:
#   images_subpath = scene-01/images
#   images_subpath = scene-01/capture-a/masked-images/session-001
images_subpath = scene-01/capture-a/masked-images/session-001

# Which files under images_subpath are photographs, comma separated. Empty
# means every supported image type, which is the historical behaviour.
#
# Set this when the dataset keeps other images beside the photographs, which is
# what every masking tool that writes next to its input produces. Neither
# COLMAP nor ns-process-data can be told to ignore part of a directory, so
# without this they treat masks as photographs: COLMAP tries to register them,
# and ns-process-data interleaves them into images/ by extension, which breaks
# its ffmpeg downscale sequence and silently costs you the image pyramid.
image_extensions =
# Files with these extensions are masks. They are always kept out of SfM.
mask_extensions =
# Where the masks live. Empty means beside each photograph, same filename stem,
# which is what a tool writing next to its input produces. Set it to a parallel
# tree of identical shape, relative to the datasets directory or absolute, when
# a batch segmentation run wrote them somewhere else. Example: with
#   images_subpath = scene-01/2025-12-01
#   mask_subpath   = scene-01/masks/2025-12-01
# the mask for scene-01/2025-12-01/cam-002/shot.jpg is
# scene-01/masks/2025-12-01/cam-002/shot.png
mask_subpath =
# false: masks are excluded and you reconstruct the full scene.
# true : masks are paired to photographs by filename stem, copied into masks/,
#        downscaled alongside the images with nearest-neighbour sampling, and
#        referenced from transforms.json, so training reconstructs only the
#        masked subject. Every photograph must have a mask; a partial set is
#        an error, not a warning.
use_masks = false

[run]
# Run ids look like:  <id_prefix>_<date>-<run_count>-<colmap_version>
# for example:        run_260807-01-312
id_prefix = run

# Leave date, run_count and colmap_version EMPTY to derive them automatically:
#   date          -> today, yymmdd
#   run_count     -> one more than the highest run already present for that
#                    date in this dataset's colmap/ and outputs/ directories
#   colmap_version-> parsed from `colmap --version`
# Set any of them to pin it by hand, for example to reproduce an old run.
date =
run_count =
colmap_version =

# Appended to on every run. Relative paths resolve under data_root.
log_file = run-log.csv

[colmap]
# auto: infer from the image directory name ("frames" -> video, else
# individual). Override with individual or video.
data_type = auto
single_camera = 1
single_camera_per_folder = 1
dense = 0
# Any further flags to pass verbatim to `colmap automatic_reconstructor`.
extra_args =

[nerfstudio]
# images or video. video is not currently exercised by the pipeline.
scene_type = images
# Required only when scene_type = video.
video_path =
# Reuse the COLMAP reconstruction produced above rather than re-running SfM.
skip_colmap = true
colmap_model_path = sparse/0

[train]
method = splatfacto
max_num_iterations = 30000
# Training resolution, as a power-of-two divisor of the source images.
#   0 : let nerfstudio choose. It picks the smallest level on disk whose long
#       edge is under 1600px, BUT it probes for that level by testing a single
#       filename, so an incomplete images_N/ reads as absent and it silently
#       falls back to native resolution.
#   1 : native resolution. On a 6 GB card with 15 MP frames this does not fail
#       at startup, it fails around step 3000 when splatfacto's
#       resolution_schedule ends and rasterisation jumps to full size.
#   2, 4, 8, ...: use images_N/, which must already exist. nerfstudio reads a
#       pinned level straight off disk and will not build a missing one.
# Pin it for anything that has to be reproducible: at 0, the resolution a run
# trained at is a property of which files happened to be on disk and is
# recorded nowhere.
downscale_factor = 0
use_scale_regularization = true
background_color = random
# true is required for any command-line run: false leaves ns-train's viewer
# alive after training finishes, which never exits and deadlocks an
# unattended run, so run_pipeline.py refuses to start the train stage.
# Set it to false ONLY for interactive notebook work where you want the
# viewer to stay up, and expect to pass --allow-viewer-hang if you then use
# the runner.
quit_on_train_completion = true
# 0 disables the local writer's log truncation.
max_log_size = 0

[export]
format = gaussian-splat
# Labels baked into the export filename so the file records what produced it.
env_label = my-env
platform_label = ubuntu
# Optional 3DGS-to-point-cloud conversion. Warning: this inflates file size by
# roughly three orders of magnitude.
export_3dgs = false
gauss_to_pc_script = ~/3DGS-to-PC/gauss_to_pc.py
